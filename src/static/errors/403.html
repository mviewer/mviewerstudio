<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>403 - Accès refusé</title>
    <link rel="stylesheet" href="css/errors.css">
</head>
<body class="error-403">
    <nav class="error-navbar">
        <div class="error-navbar__brand">
            <img src="img/logo_mviewerstudio.svg" alt="Logo Mviewer Studio">
            <span>Mviewer Studio</span>
        </div>
    </nav>
    <main class="error-home">
        <section class="error-home__visual">
            <img src="img/homeMstudio.svg" alt="Illustration Mviewer Studio">
            <div>
                <span class="subtitle-home">MVIEWER STUDIO</span>
            </div>
        </section>
        <section class="error-home__actions">
            <h2>Accès refusé</h2>
            <p class="error-home__lead">Votre compte est authentifié, mais il n'appartient pas à un groupe autorisé pour accéder à Mviewer Studio.</p>
            <div class="error-cards">
                <a class="error-card error-card--warning" href="/">
                    <div class="error-card__icon">↩</div>
                    <h3>Retour au site</h3>
                    <p>Revenir au portail principal ou à l'application d'origine.</p>
                </a>
            </div>
        </section>
    </main>
</body>
</html>
